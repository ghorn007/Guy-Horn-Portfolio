<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guy Horn | Video Editor &amp; Thumbnail Designer</title>
<meta name="description" content="Portfolio of Guy Horn: video editing and thumbnail design.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --text: #eeeeee;
    --dim: #6b6b6b;
    --lime: #c8f31d;
    --display: "Bebas Neue", "Oswald", Impact, "Arial Narrow", sans-serif;
    --mono: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 .85rem/1.6 var(--mono); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
  .page { max-width: 1800px; margin: 0 auto; padding: 0 1.25rem; }

  /* Top bar */
  .bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: stretch;
    height: 4rem; padding: 0 1.25rem;
    background: rgba(10,10,10,.92); backdrop-filter: blur(10px);
  }
  .brand { align-self: center; font: 400 1.4rem/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--lime); text-decoration: none; }
  .tabs { position: relative; display: flex; gap: 1.75rem; }
  .tab {
    appearance: none; background: none; border: 0; cursor: pointer; padding: 0;
    font: 400 .72rem var(--mono); letter-spacing: .14em; text-transform: uppercase;
    color: var(--dim); transition: color .2s;
  }
  .tab:hover, .tab[aria-selected="true"] { color: var(--text); }
  .playhead {
    position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background: var(--lime);
    transition: transform .3s cubic-bezier(.4,0,.2,1), width .3s cubic-bezier(.4,0,.2,1);
  }

  .panel { padding-top: clamp(1.5rem, 4vw, 3rem); }
  .panel[hidden] { display: none; }

  /* Videos */
  .video h3 { display: flex; align-items: baseline; gap: .9rem; margin: 0 0 .7rem; font: 400 1.5rem/1.1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
  .video h3 small { font: 400 .68rem var(--mono); letter-spacing: .12em; color: var(--dim); }
  .frame { aspect-ratio: 16 / 9; width: 100%; background: #000; }
  .frame iframe, .frame video { display: block; width: 100%; height: 100%; border: 0; }
  .video.featured { margin-bottom: clamp(3rem, 7vw, 5rem); }
  .video.featured h3 { font-size: clamp(2rem, 4vw, 2.6rem); }
  .more { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(2rem, 4vw, 3rem); }

  /* Thumbnail mosaic */
  .mosaic { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin: 0; padding: 0; list-style: none; }
  .mosaic li { grid-column: span 4; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
  .mosaic li:nth-child(1) { grid-column: span 7; }
  .mosaic li:nth-child(2) { grid-column: span 5; aspect-ratio: auto; }
  .mosaic button { display: block; position: relative; width: 100%; height: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
  .mosaic img { display: block; width: 100%; height: 100%; object-fit: cover; transition: opacity .2s; }
  .mosaic button:hover img { opacity: .82; }

  dialog.lightbox { padding: 0; border: 0; background: transparent; max-width: min(96vw, 1400px); width: 100%; overflow: visible; }
  dialog.lightbox::backdrop { background: rgba(0,0,0,.94); }
  dialog.lightbox img { display: block; width: 100%; height: auto; max-height: 88vh; object-fit: contain; }
  dialog.lightbox form { margin: 0; text-align: right; }
  dialog.lightbox button { margin-bottom: .5rem; padding: .35rem 0; cursor: pointer; background: none; color: var(--dim); border: 0; font: 400 .7rem var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  dialog.lightbox button:hover { color: var(--text); }

  /* Programs */
  .programs { margin-top: clamp(4rem, 9vw, 7rem); }
  .programs h2 { margin: 0 0 .6rem; font: 400 .7rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .programs ul { display: flex; flex-wrap: wrap; gap: .4rem 1.75rem; margin: 0; padding: 0; list-style: none; }

  /* Footer */
  footer { margin-top: clamp(3rem, 7vw, 5rem); padding: 0 0 2.5rem; }
  footer .page { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  footer a { text-decoration: none; border-bottom: 1px solid var(--dim); padding-bottom: 2px; transition: color .2s, border-color .2s; }
  footer a:hover { color: var(--lime); border-color: var(--lime); }
  footer .r { color: var(--dim); font-size: .7rem; letter-spacing: .08em; }

  @media (max-width: 760px) {
    .more { grid-template-columns: 1fr; }
    .mosaic { grid-template-columns: 1fr; }
    .mosaic li, .mosaic li:nth-child(1), .mosaic li:nth-child(2) { grid-column: auto; aspect-ratio: 16 / 9; }
    .tabs { gap: 1.1rem; }
    .brand { font-size: 1.2rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .playhead, .tab, .mosaic img, footer a { transition: none; }
  }
</style>
</head>
<body>

<header class="bar">
  <a class="brand" href="#videos">Guy Horn</a>
  <nav class="tabs" role="tablist" aria-label="Portfolio sections">
    <button class="tab" role="tab" id="tab-videos" aria-controls="panel-videos" aria-selected="true">Videos</button>
    <button class="tab" role="tab" id="tab-thumbnails" aria-controls="panel-thumbnails" aria-selected="false" tabindex="-1">Thumbnails</button>
    <span class="playhead" aria-hidden="true"></span>
  </nav>
</header>

<main class="page">

  <!-- VIDEOS -->
  <section class="panel" id="panel-videos" role="tabpanel" aria-labelledby="tab-videos">
    <article class="video featured">
      <h3>Video Essay <small>Sneak peek</small></h3>
      <div class="frame">
        <video controls preload="metadata" playsinline poster="assets/sneak-peek-poster.jpg">
          <source src="assets/sneak-peek.mp4" type="video/mp4">
        </video>
      </div>
    </article>

    <div class="more">
      <article class="video">
        <h3>True Crime Documentary</h3>
        <div class="frame">
          <iframe src="https://www.youtube-nocookie.com/embed/zuhAg1u4AdM" title="True Crime Documentary" loading="lazy" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
        </div>
      </article>
      <article class="video">
        <h3>Gaming</h3>
        <div class="frame">
          <iframe src="https://www.youtube-nocookie.com/embed/7AAn4sax9gs" title="Gaming" loading="lazy" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
        </div>
      </article>
    </div>
  </section>

  <!-- THUMBNAILS -->
  <section class="panel" id="panel-thumbnails" role="tabpanel" aria-labelledby="tab-thumbnails" hidden>
    <ul class="mosaic">
      <li><button type="button" data-full="assets/thumb-1.jpg"><img src="assets/thumb-1.jpg" alt="Thumbnail: Day 1 versus Day 7 comparison with a horned creature in a flat cap"></button></li>
      <li><button type="button" data-full="assets/thumb-2.jpg"><img src="assets/thumb-2.jpg" alt="Thumbnail: wanted poster on a pinboard with an FBI seal, a map and a McDonald's logo" loading="lazy"></button></li>
      <li><button type="button" data-full="assets/thumb-3.jpg"><img src="assets/thumb-3.jpg" alt="Thumbnail: snow-covered cabin at night glowing red from inside" loading="lazy"></button></li>
      <li><button type="button" data-full="assets/thumb-4.jpg"><img src="assets/thumb-4.jpg" alt="Thumbnail: gaming thumbnail with a red downward arrow and an inked ape character" loading="lazy"></button></li>
      <li><button type="button" data-full="assets/thumb-5.jpg"><img src="assets/thumb-5.jpg" alt="Thumbnail: man in a dark forest with the word AFRAID in red" loading="lazy"></button></li>
    </ul>
  </section>

  <!-- PROGRAMS -->
  <section class="programs" aria-labelledby="programs-title">
    <h2 id="programs-title">Programs used</h2>
    <ul>
      <li>Photoshop</li>
      <li>Premiere Pro</li>
      <li>After Effects</li>
      <li>Blender</li>
    </ul>
  </section>
</main>

<footer>
  <div class="page">
    <a href="mailto:guyhornbiz@gmail.com">guyhornbiz@gmail.com</a>
    <span class="r">&copy; <span id="year">2026</span> Guy Horn</span>
  </div>
</footer>

<dialog class="lightbox" id="lightbox" aria-label="Thumbnail preview">
  <form method="dialog"><button>Close</button></form>
  <img alt="">
</dialog>

<script>
  const tabs = [...document.querySelectorAll('.tab')];
  const playhead = document.querySelector('.playhead');
  const names = ['videos', 'thumbnails'];

  function movePlayhead() {
    const t = tabs.find(el => el.getAttribute('aria-selected') === 'true');
    playhead.style.width = t.offsetWidth + 'px';
    playhead.style.transform = 'translateX(' + t.offsetLeft + 'px)';
  }

  function select(name, focus) {
    tabs.forEach(t => {
      const on = t.id === 'tab-' + name;
      t.setAttribute('aria-selected', on);
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
      if (on && focus) t.focus();
    });
    movePlayhead();
    history.replaceState(null, '', '#' + name);
  }

  tabs.forEach((t, i) => {
    t.addEventListener('click', () => select(names[i]));
    t.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') select(names[(i + 1) % names.length], true);
    });
  });

  // Open the right tab from the link (e.g. yoursite.com/#thumbnails)
  select(location.hash === '#thumbnails' ? 'thumbnails' : 'videos');
  window.addEventListener('resize', movePlayhead);
  if (document.fonts) document.fonts.ready.then(movePlayhead);

  // Lightbox
  const box = document.getElementById('lightbox');
  const boxImg = box.querySelector('img');
  document.querySelectorAll('.mosaic button').forEach(b => {
    b.addEventListener('click', () => {
      boxImg.src = b.dataset.full;
      boxImg.alt = b.querySelector('img').alt;
      box.showModal();
    });
  });
  box.addEventListener('click', e => { if (e.target === box) box.close(); });

  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
